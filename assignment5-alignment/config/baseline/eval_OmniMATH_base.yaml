# 数据集路径 
example_path: "train_data/datasets/OmniMATH/validation.jsonl"

# Prompt 模板路径 
prompt_path: "cs336_alignment/prompts/r1_zero.prompt"

# 2. 模型配置

model_path: "train_data/models/Qwen2.5-Math-1.5B"

# 3. 采样参数配置
# 生成的最大 Token 数量
max_tokens: 4096

# 采样温度 (0 表示 Greedy Decoding，适合数学/推理任务)
temperature: 0.7

# 核采样概率 
top_p: 0.95

# 4. 输出路径配置
# 详情结果保存路径 (保存每条数据的生成文本、得分和长度等，支持 .json 或 .jsonl)
output_path: "train_data/output/math_baseline_results/qwen_1.5b_omnimath_details.jsonl"

# 统计指标日志保存路径 (TXT 格式，追加模式，用于汇总多个实验的准确率和平均长度)
output_log: "output_log/math_baseline_results/baseline_eval_logs.txt"