# exp_bespoke_256.yaml (具体的实验名片)

model:
  model_id: "train_data/models/Qwen2.5-Math-1.5B"
  output_dir: "output/qwen_sft_Bespoke17k_2048_final_true"
  checkpoint_dir: "checkpoints/qwen_sft_Bespoke17k_2048_checkpoints_true" # [新增] 断点检查点保存路径
  max_seq_length: 2560                       # 训练最大序列长度
data:
  train_path: "train_data/datasets/Bespoke17k/sft.jsonl"
  val_path:
  - "train_data/datasets/AIME_2024/validation.jsonl"
  - "train_data/datasets/AIME_2025/validation.jsonl"
  - "train_data/datasets/AMC/validation.jsonl"
  - "train_data/datasets/GSM8K/validation.jsonl"
  - "train_data/datasets/MATH-500/validation.jsonl"
  - "train_data/datasets/OmniMATH/validation.jsonl"
  num_train_examples: 2048
  filter_correct_only: true       # 第一阶段不过滤，照单全收
  num_val_examples: 500            # 每次评估 200 条
wandb:
  run_name: "qwen_sft_5test_Bespoke17k_2048_true"